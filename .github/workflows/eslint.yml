name: ESLint
on:
  pull_request:
    branches: [main]
jobs:
  eslint:
    # PRs only from org members, collaborators and the listed team members whose
    # org membership is private (GitHub reports them as CONTRIBUTOR).
    if: >-
      github.event_name != 'pull_request' ||
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
      contains(fromJSON('["alcercu"]'), github.event.pull_request.user.login)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Enable corepack
        run: corepack enable
      - name: Install modules
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false
      - name: Run ESLint
        run: yarn check-style
