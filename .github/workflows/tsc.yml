name: TypeCheck
on:
  pull_request:
    branches: [main]
jobs:
  TypeScriptCompiler:
    # PRs only from branches in this repo, which needs write access: fork PRs
    # from outside contributors skip CI.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Enable corepack
        run: corepack enable
      - name: Install modules
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false
      - name: Run TypeScriptCompiler
        run: yarn check-types
      - name: Check the agent catalogue is current
        run: |
          node scripts/layer/gen-catalog.mjs
          git diff --exit-code -- agent/catalog.json agent/CATALOG.md || {
            echo "::error::agent/catalog.json or agent/CATALOG.md is out of date: run node scripts/layer/gen-catalog.mjs and commit both"
            exit 1
          }
