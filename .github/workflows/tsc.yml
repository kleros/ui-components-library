name: TypeCheck
on:
  pull_request:
    branches: [main]
jobs:
  TypeScriptCompiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Enable corepack
        run: corepack enable
      - name: Install modules
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false
      - name: Run TypeScriptCompiler
        run: yarn check-types
