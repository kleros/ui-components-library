name: Unit Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Enable corepack
        run: corepack enable
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20
          cache: yarn
      # No dependency build script is needed: esbuild ships its binary in a
      # platform package, and jsdom treats canvas as optional.
      - name: Install modules
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false
      - name: Run unit tests with coverage
        run: yarn test:unit:coverage
      # Fails below the break threshold in stryker.config.json.
      - name: Run mutation tests
        run: yarn test:mutation
      - name: Upload coverage and mutation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-and-mutation-reports
          path: |
            coverage/
            reports/mutation/
          if-no-files-found: warn
